name: 🤖 Auto Content Generator

on:
  # Run 3x daily — morning, afternoon, evening (IST)
  schedule:
    - cron: '30 1 * * *'    # 07:00 IST
    - cron: '30 7 * * *'    # 13:00 IST
    - cron: '30 13 * * *'   # 19:00 IST
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      max_to_process:
        description: 'Max jobs to generate (default: 10)'
        required: false
        default: '10'

jobs:
  generate:
    name: Scrape & Generate Content
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Generate AI content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_TO_PROCESS: ${{ github.event.inputs.max_to_process || '10' }}
        run: python scripts/generate_content.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/jobs.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated jobs.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GovtJobsBot"
          git add data/jobs.json
          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
          JOB_COUNT=$(python -c "import json; print(len(json.load(open('data/jobs.json'))))")
          git commit -m "🤖 Auto-update: $JOB_COUNT jobs [$TIMESTAMP]"
          git push

      - name: Trigger deploy workflow
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            })
